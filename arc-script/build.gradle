plugins {
  id 'buildlogic.java-library-conventions'
  id 'groovy'
}

dependencies {
  api 'org.apache.groovy:groovy:4.0.14'
  api 'org.apache.groovy:groovy-json:4.0.24'

  implementation project(':core')
  implementation project(':common')
  implementation 'org.slf4j:slf4j-api'

  // columnar projection store backing the ARROW query engine (QueryEngineSettings.EngineMode):
  implementation 'org.apache.arrow:arrow-vector:17.0.0'
  implementation 'org.apache.arrow:arrow-memory-netty:17.0.0'
  // paginated result token registry (ArrowResultSetStore):
  implementation 'com.github.ben-manes.caffeine:caffeine:3.2.1'

  testImplementation platform('org.junit:junit-bom:5.10.0')
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testImplementation 'org.assertj:assertj-core:3.25.3'
  testImplementation 'org.smartbit4all.platform:api'
  testRuntimeOnly 'org.slf4j:slf4j-simple'
}

test {
  useJUnitPlatform()
  // arrow-memory-netty's MemoryUtil reflectively pokes java.nio.Buffer.address; required on the
  // JDK module system since JDK 16 (see https://arrow.apache.org/docs/java/install.html):
  jvmArgs '--add-opens=java.base/java.nio=ALL-UNNAMED'
}